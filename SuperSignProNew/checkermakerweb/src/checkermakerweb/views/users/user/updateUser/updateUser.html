      <div class="content-wrapper content-bg-color">
        <!-- Content Header (Page header) -->
        <div class="content-header">
          <div class="container-fluid">
            <div class="row mb-2">
              <div class="col-sm-6">
                <h3 id="searchusers" class="m-0 text-color-white lang" key="UPDATESUSER">Update Users</h3>
                </div><!-- /.col -->
                <div class="col-sm-6">
                  <ol class="breadcrumb d-flex justify-content-end">
                    <li class="breadcrumb-item"><a id="lihome" href="/Dashboard" class="lang" key="HOME">Home</a></li>
                    <li id="lisearchusers" class="breadcrumb-item active lang" key="UPDATESUSER">Update Users</li>
                  </ol>
                  </div><!-- /.col -->
                  </div><!-- /.row -->
                  </div><!-- /.container-fluid -->
                </div>
                <!-- /.content-header -->
                <form action="/User/UpdateUser/{{.Id}}" id="addUsersValidate" method="post">
                  <!-- Main content -->
                  <section class="content">
                    <div class="container-fluid">
                      <!-- Small boxes (Stat box) -->
                      <div class="row">
                        <div class="col-12">
                          <!-- Default box -->
                          <div class="card card-bg-color">
                            <div class="card-header">
<!--                              <h3  class="card-title text-color-white">User</h3>-->
                            </div>
                            <div class="card-body ">
                              <div class="row">
                              
                              
                                <div class="col-sm-4">
                                  <!-- text input -->
                                  <div class="form-group">
                                    <label id="firstname" class="text-color-white required lang" key="FULLNAME">Full Name</label>
                                  <input type="text" pattern="[a-zA-Z]+" title="Please enter Alphabets." onkeypress="return (event.charCode > 64 && 
event.charCode < 91) || (event.charCode > 96 && event.charCode < 123)" maxlength="30" class="form-control text-ph-backgroud-color lang" key="ENTERFNAME" placeholder="Enter Full Name" name="input_full_name" id="input_full_name" value="{{.FullName}}"/>
                                  </div>
                                </div>
                                
                                
                                
                                <div class="col-sm-4">
                                  <!-- text input -->
                                  <div class="form-group">
                                    <label id="email" class="text-color-white required lang" key="EMAIL">Email</label>
                                    <input type="email" maxlength="50" class="form-control text-ph-backgroud-color lang" key="ENTEREMAIL" placeholder="Enter Email" name="input_email" id="input_email"  value="{{.Email}}" readonly/>
                                  </div>
                                </div>
                                <div class="col-sm-4">
                                  <!-- text input -->
                                  <div class="form-group">
                                    <label id="mobilenum" class="text-color-white required lang" key="MOBILENUMBER">Mobile Number</label>         
                                  <input type="number" pattern="^\d{10}$" title="Please enter 10 digit number" onKeyPress="if(this.value.length==10) return false;" class="form-control text-ph-backgroud-color lang" key="ENTERMNUMB" placeholder="Enter Mobile Number" name="input_mobile" id="input_mobile"  value="{{.Mobile}}" readonly/>
                                  </div>
                                </div>
                                <div class="col-sm-4">
                                  <!-- text input -->
                                  <div class="form-group">
                                    <label id="firstname" class="text-color-white required lang" key="USERTYPE">User Type</label>
                                    <select class="form-control" id="input_user_type" name="input_user_type">
                                        <option class="select lang" key="PLSLCT" value="">--- Please Select ---</option>
                                          {{range $key, $val := .Dis4.Fields4}}
                                        <option value="{{$val.Id}}">{{$val.Name}}</option>
                                          {{end}}
                                    </select>
                                  </div>
                                </div>
                                <div class="col-sm-4">
                                  <!-- text input -->
                                  <div class="form-group">
                                    <label id="add1" class="text-color-white required lang" key="ADDRESS1">Address 1</label>
                                    <input type="text" maxlength="25" pattern="[ A-Za-z0-9_$&+,:;=?@-#|~`'<>.^*(){}/\''%!]*$" class="form-control text-ph-backgroud-color lang" key="ENTERADDRESS1" placeholder="Enter Address 1" name="input_address1" id="input_address1"  value="{{.Address1}}"/>
                                  </div> 
                                </div>
                                <div class="col-sm-4">
                                  <!-- text input -->
                                  <div class="form-group">
                                    <label id="add1" class="text-color-white required lang" key="ADDRESS2">Address 2</label>
                                    <input type="text" maxlength="25" pattern="[ A-Za-z0-9_$&+,:;=?@-#|~`'<>.^*(){}/\''%!]*$" class="form-control text-ph-backgroud-color lang" key="ENTERADDRESS2" placeholder="Enter Address 2" name="input_address2" id="input_address2"  value="{{.Address2}}"/>
                                  </div> 
                                </div>
                                <div class="col-sm-4">
                                  <!-- text input -->
                                  <div class="form-group">
                                    <label id="lang" class="text-color-white required lang" key="LANGUAGE">Language</label>
                                    <select class="form-control text-ph-backgroud-color" id="input_language" name="input_language" >
                                       <option class="plsselect lang" key="PLSLCT" value="">-- Please Select --</option>  
                                      <option value="english">English</option>
                                      <option value="french">French</option>
                                      
                                   
                                    </select>
                                  </div>
                                </div>
                                
                                <div class="col-sm-4">
                                  <!-- text input -->
                                  <div class="form-group">
                                    <label id="cname" class="text-color-white required lang" key="STATUS">Status</label>
                                   <select class="form-control" id="input_status" name="input_status">
                                  <!--<datalist id="input_category_name">-->
                                <option class="select lang" key="PLSLCT" value="">-- Please Select --</option>
                                {{range $key, $val := .Dis.Fields1}}
                                <option value="{{$val.Name}}">{{$val.Name}}</option>
                                {{end}}
                               <!-- </datalist>-->
                            </select>
                                  </div>
                                </div>
                               
                                
                                
                               
                              </div>
                            </div>
                            <div class="card-footer" style="text-align: center;">
                           <button id="submit" type="submit" class="btn btn-primary lang" key="SUBMIT">Submit</button>
                            <a href="/User/SearchUser"><button id="back" type="button" class="btn btn-primary lang" key="BACK">Back</button></a>
                          </div>
                            <!-- /.card-footer-->
                            <!-- /.card -->
                          </div>
                        </div>
                        <!-- /.card -->
                        <!-- /.row -->
                        <!-- Main row -->
                        <div class="row">
                        </div>
                        <!-- /.row (main row) -->
                        </div><!-- /.container-fluid -->
                        

                       
                      </section>
                    </form>

                <script>
                document.getElementById("userrmanagement-menu").className += " menu-open";
                document.getElementById("userrmanagement-active").className += " active";
                document.getElementById("searchuser-active").className += " active";
                </script>
                <script>
                  /** add active class and stay opened when selected */
                  var url = document.getElementById('searchuser-active');
                  const allLinks = document.querySelectorAll('.nav-item a');
                  const currentLink = [...allLinks].filter(e => {
                      return e.href == url;
                  });
              
                  if (currentLink.length > 0) { //this filter because some links are not from menu
                      currentLink[0].classList.add("active");
                      currentLink[0].closest(".nav-treeview").style.display = "block";
                      currentLink[0].closest(".has-treeview").classList.add("active");
                  }
                </script>
